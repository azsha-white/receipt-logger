name: GitHub Release

# `npm run release` pushes a vX.Y.Z tag; this turns it into a GitHub Release with generated notes.
# The page itself is deployed by deploy.yml on the push to main that carries the same commit.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Receipt Logger $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
